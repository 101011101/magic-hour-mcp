[project]
name = "mcp-magichour"
version = "0.1.0"
description = "OpenAPI-backed MCP server wrapping the Magic Hour API"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.0,<4.0",
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.0",
    "posthog==7.51.2",
    "starlette>=1.0.1",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
# For a server that makes multi-clip films (the join step): ffmpeg when none is installed, and caption drawing.
production = ["imageio-ffmpeg>=0.5", "pillow>=10.1"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_magichour*"]

[tool.setuptools.package-data]
mcp_magichour = ["openapi.json", "tool_notes.json", "question_sheets.json", "favicon.ico", "static/project-result/index.html", "static/project-result/assets/*"]

[tool.vercel.scripts]
build = "npm --prefix web ci && npm --prefix web run build"
